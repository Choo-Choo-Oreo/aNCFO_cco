l_english:
 # Aborroas Treaty — re-flavored from the VNR dependency's naval treaty loc
 # (owner decision 1826-07-09). Internal keys kept; text is Fyjuh-native.
 MTG_escalator_clause_condition: "No country has refused to renew the treaty."
 MTG_naval_treaty.12.a: "Agreed."
 MTG_naval_treaty.12.b: "Rejected."
 MTG_naval_treaty.12.d: "Following the unprecedented carnage and expense of the Great War, the popular mood across the globe was peace and disarmament, which reigned throughout the 1920s. As an extension of conditions agreed in previous treaty for naval disarmament, the Second Aborroas Naval Conference was held on 9 Dec, 1735. However, the negotiation between signatories of the Aborroas Accord is anything but peace, with terms below presented as the final resolution until its expiration in 1742.\n\n1. No capital ship shall exceed 35,000 tons standard displacement or carry a gun with a caliber over 14 in (356mm).\n\n2. No aircraft-carrier shall exceed 23,000 tons or carry a gun with a caliber over 6.1 in (155mm).\n\n3. No light surface vessel shall exceed 8,000 tons standard displacement. But if the requirements of the national security of any signatories are, in his opinion, materially affected by the actual or authorized amount of construction by any power of light surface vessels, it has the right to lay down or acquire light surface vessels with maximum standard displacement of 10,000 tons.\n\n4. Provided that if any of the signatories of the Treaty of Aborroas should fail to enter into an agreement to conform to this provision prior to the date of the coming into force of the present treaty, the maximum caliber of guns carried on capital ships shall be 16 in (406mm)."
 MTG_naval_treaty.12.t: "Second Aborroas Naval Conference"
 MTG_naval_treaty_adherent: "Aborroas Accord Signatory"
 MTG_naval_treaty_adherent_1936: "Second Aborroas Accord Signatory"
 MTG_naval_treaty_adherent_1936_desc: "We have signed the Second Aborroas Accord and accordingly are restricted in the size of our capital ships and submarines. Besides, the Aborroas Submarine Protocol (cruiser rules) has enforced strict regulations on merchant raiding."
 MTG_naval_treaty_adherent_desc: "We have signed the Aborroas Accord and accordingly are restricted in the size of our capital ships. Besides, the Aborroas Submarine Protocol (cruiser rules) has enforced strict regulations on merchant raiding."
 MTG_naval_treaty_adherent_reduced: "Escalator Clause Invoked"
 MTG_naval_treaty_adherent_reduced_desc: "After some signatories of the Treaty of Aborroas have abandoned the Aborroas Accord, we have invoked the Escalator Clause, reducing the restrictions for the size and armament of our capital ships."
 MTG_treaty_rejoin_mission: "Rejoin Second Aborroas Accord"
 MTG_treaty_rejoin_mission_desc: "We haven't signed the treaty by its deadline. Now it's our last chance to rejoin it, or the escalator clause will be activated a year later."
 MTG_treaty_renew_mission: "Second Aborroas Naval Disarmament Conference"
 MTG_treaty_renew_mission_desc: "The Second Aborroas Naval Conference was intended to limit the growth in naval armaments until its expiration in 1742."
 MTG_treaty_renew_mission_tt: "§GThe Second Aborroas Naval Disarmament Conference will come to a close.§!\n"
 MTG_treaty_renew_mission_tt_a: "§YIf any member of the conference refused to sign the treaty:§!"
 MTG_treaty_renew_mission_tt_b: "§YIf we fail to sign the treaty:§!"
 democracy_renew_naval_treaty_tt: "§GContinuing negotiation of the naval treaty will please the public.§!"
 fascism_renew_naval_treaty_tt: "§RContinuing negotiation of the naval treaty will anger most members of our government.§!"
 washington_treaty_article_xix: "Treaty of Aborroas: Article XIX"
 washington_treaty_article_xix_desc: "Article XIX of the Treaty of Aborroas forbids us to build new naval bases or coastal bunkers on Pacific islands."
