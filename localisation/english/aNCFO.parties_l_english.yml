l_english:
  pluralism:0 "Plural-Democracy"
  pluralism_noun:0 "Pluralist Movement"
  pluralism_desc:0 "Plural-Democracy"
  pluralism_acceptance:0 "£ai_acceptance_texticon  Acceptance of Pluralism Diplomacy"
  pluralism_drift:0 "£boost_popularity_texticon  Daily Pluralism Drift"
  sub_illuminism: "Illuminism"
  sub_illuminism_desc: "A desire for a weak federal government and a strong local government. Closest ideology that desires a stateless society or the High Phase of social development. Typically, a focus on non-dominance policy with poor enforcement to the main pluralism ideals. The poor enforcement causes illuminism to recreate a hierarchy of communities within a confederation in practice. They also have a policy of associationism for the government to run effectively, one of their better practices in reality."
  sub_pluralism: "Pluralism"
  sub_pluralism_desc: "Their belief is that of republicanism, and dominance takes away freedom, not interference. A goal for all to have legitimate representation, liberty, and opportunity without domination. The largest issue of pluralism is that it relies on high trust, and with any system mismanagement and corruption will occur, eroding trust. Pluralism uses its own core principle of non-domination to slow erosion by providing checks, balances, and directly allowing local associations to challenge each other and the federal government."
  sub_spiritual_democracy: "Spiritual Democracy"
  sub_spiritual_democracy_desc: "The divine does not rule through clergy or mandate, it blesses what the people already choose for themselves. Elections are not merely tolerated by faith, they are how the people's will and the divine will are understood to align. There is no clergy standing between the ballot and the blessing, and no doctrine that could override what the people decide, since the two are treated as one expression rather than two sources that might conflict."
  sub_constitutionalism: "Constitutionalism"
  sub_constitutionalism_desc: "Desire to have or to maintain the nation’s constitution. They firmly believe the capabilities of government must be written down to protect individuals from loss of liberty. Many constitutionalist writers create rules to restrict a government from being interfering and domineering."
  sub_conservatism: "Conservatism"
  sub_conservatism_desc: "Focuses on the accumulation of social knowledge, governing precedent, and valuing stable change. They do not oppose change, but favor a careful, technical approach instead."
  sub_liberalism: "Liberalism"
  sub_liberalism_desc: "Liberalism and obscurism both share opposition to pluralism's non-domination principle, stating interference is the issue instead. Unlike obscurism, however, Liberalism accepts representation as a legitimate source of governmental authority. It therefore favors capitalism as the natural extension of that belief, treating most state regulation of property or commerce as unwelcome interference, though it still accepts government's basic role in enforcing contracts and protecting property itself."
  sub_progressivism: "Progressivism"
  sub_progressivism_desc: "Unlike conservatism's slow and methodical approach to change, progressivism desires change due to morality. Delay itself is a choice to let those suffering under the current system continue to suffer. They advocate for moral progression to prevent needless deaths and suffering."
  sub_populism: "Populism"
  sub_populism_desc: "Holds that majority rule is the most direct expression of individual will, and therefore the purest form of representation, not a unified people against elites, but a shifting aggregation of individual choices. Because no majority is permanent, populism grows skeptical of fixed institutional checks that persist against a current majority's will, treating persistence itself, not concentration of power, as the mark of domination. It leans toward non-domination through impermanence rather than protection, trusting that a majority which cannot outlast the next vote cannot calcify into the entrenched power true domination requires."

  semidemocracy:0 "Partial-Democracy"
  semidemocracy_noun:0 "Transitionist Movement"
  semidemocracy_desc:0 "Partial-Democracy"
  semidemocracy_acceptance:0 "£ai_acceptance_texticon  Acceptance of Transitionist Diplomacy"
  semidemocracy_drift:0 "£boost_popularity_texticon  Daily Transitionist Drift"
  sub_obscurism: "Obscurism"
  sub_obscurism_desc: "Their belief is that of anti-republicanism, interference takes away freedom, not domination. Since most people cannot reliably judge who is fit to rule, elections do not prevent arbitrary power, they merely disguise it behind a process that feels accountable. Legitimacy should instead rest on demonstrated capability rather than consent, so a capable ruler exercising full power is not domination, it is competence, while elections, competing factions, and divided authority are the interference that degrades outcomes. It is the inversion of Pluralism's core goals."
  sub_transitional_democracy: "Transitional-Democracy"
  sub_transitional_democracy_desc: "A nation without functioning representative government, taking a slow and deliberate approach to build one, prioritizing stability over the speed of transition. Even under pressure from progressivists, transitionalism's approach resists speeding up. Their reasoning runs contrary to progressivism. They claim instability itself causes suffering, since institutions that fail before they stabilize leave individuals with no functioning structure to rely on, even as those institutions focus on internal reform."
  representative_monarchy: "Representative Monarchism"
  representative_monarchy_desc: "Authority remains hereditary, but the monarch cannot govern without active, ongoing popular consent. The people hold a real check, advisory councils, provincial voice, or a binding say in governance, not just ceremonial recognition. The monarch retains final veto power, but that veto is only as durable as the people's continued willingness to accept it. This isn't a personal style of rule that shifts with whoever sits the throne, it's built into the office itself, whoever the monarch is, they answer to a standing body of the people rather than ruling absolutely or existing as a mere figurehead."
  sub_traditionalism: "Traditionalism"
  sub_traditionalism_desc: "Rejection of change to new systems. What works in the past will work now. It demands that all forms of change be stopped, even at high cost. Departure from the wisdom of the past is a departure from what works. Those who desire change desire suffering, failure, and instability.."
  sub_mercantile_republicism: "Merchant-Republicism"
  sub_mercantile_republicism_desc: "Roots executive prestige in the Dogateship, legislative pluralism in guild representation, and popular sovereignty through regular Concourse sessions, honoring both Insulaen oligarchic stability and Old Archaigan democratic engagement in a freshly forged, mercantile state. Its central concern is non-domination within the market specifically, since guild representation and Concourse sessions exist to prevent any single actor from monopolizing trade or extracting unaccountable advantage over rival merchants. This focus is not incidental. Nations that adopt it tend to sit at choke-points, trade hubs, or narrow corridors between larger powers, where survival depends on remaining indispensable and inoffensive to everyone who could otherwise cut them off. A market that permits domination invites those powers to route around them, and being routed around means economic strangulation. In the industrial age, this openness compounds the same survival logic: falling behind rivals industrially is as dangerous as losing trade routes, since open capital and trade let innovation spread faster than isolation allows. Outside the market, this same focus produces indifference, since guilds and Concourse have neither the standing nor the incentive to police domination that does not touch trade."
  sub_socialism: "Socialism"
  sub_socialism_desc: "Wealth in the hands of the few permits them to dominate the poor and downtrodden. Socialism seeks a careful balance of welfare and freedoms for denizens against the tyrannical nature of capitalism. It insists the people be represented in government, with their authority standing above the wealthy few, foreign and domestic, and it will not permit capitalism to dominate a nation's people."
  sub_illiberalism: "Illiberalism"
  sub_illiberalism_desc: "Democracy is too weak and fractured to defend the nation's peoples from foreign and domestic threats. When a nation is democratic, it bickers and squalls over needless problems rather than true threats. A strong centralized state is the only way to secure the nation against threats. Democracy creates polarization that erodes the nation itself, leaving the people open and vulnerable to those who wish harm."

  theocratism:0 "Theocratism"
  theocratism_noun:0 "Theocratic Movement"
  theocratism_desc:0 "Theocratic Regime"
  theocratism_acceptance:0 "£ai_acceptance_texticon  Acceptance of Theocratism Diplomacy"
  theocratism_drift:0 "£boost_popularity_texticon  Daily Theocratism Drift"
  sub_harmonainism: "Harmonainism"
  sub_harmonainism_desc: "Refer to the Harmonainus faith section above this chapter. Authority cascades upward through election rather than inheritance. The people appoint their Diaconel directly. Each rank above elects the rank immediately senior to it, Curatores chosen by Presbytae and nobles, Praelectors chosen by Curatores, Sacratones chosen by Praelectors, and finally the Deipraesul chosen by the Senate. This structure was genuinely ahead of its time, since it built consent into a divine mandate at every level rather than resting authority on bloodline alone. In recent centuries that structure has calcified. Because Neema's will can never be directly confirmed, incumbents at each tier have had generations to entrench themselves through tradition rather than contest, and the noble held Presbytae tier in particular has narrowed real competition long before it ever reaches the Senate. The election still happens. It has simply stopped meaning what it once did."
  sub_radical_harmonainism: "Radical Harmonainism"
  sub_radical_harmonainism_desc: "Refer to the Harmonainus faith section above this chapter. It keeps the same electoral cascade as basic Harmonainism, but reads the faith's decline as a measurable, worsening fact rather than a slow drift to be managed patiently. Where basic Harmonainism has let calcification happen quietly, Radical Harmonainism treats reversing it as urgent, and directs that urgency outward rather than inward. Expansion, reconquest, and forceful spread of the faith are prioritized over reforming the hierarchy's own internal decay, since a faith that is shrinking cannot afford to spend its strength correcting itself. Arcana scarcity was already being tracked and feared by scholars in this era. A radical reading of that data as proof of Kehnohs's advance gave the movement's urgency a foundation that looked scientific as much as scriptural, which is part of what made it dangerous rather than merely zealous."
  sub_reformed_harmonainism: "Reformed Harmonainism"
  sub_reformed_harmonainism_desc: "Refer to the Neeman faith section above this chapter. Neeman rejects Enohsi Psykhawn as a false prophet rather than a corrupted messenger, a break in kind from the base faith, not a milder version of it. The movement began on the Insulae Islands, the same soil that would later produce Mercantile Republicanism, and carried that same skepticism of unquestionable central authority into its own governance. It gutted the aristocratic tiers tied to nobility and rebuilt the Senate on Pluralist principles of representation rather than closed elite selection. Its survival past the war that ended the base and radical branches owes less to shared conviction with its eventual allies than to circumstance. Merchant Republica grew steadily more secular with time, and Neema's own origin on Insulaen soil was not enough to outweigh that secularism, nor did most of the wartime coalition share Neeman's faith at all. Neeman outlasted its rivals by being out of the way of a war fought on secular terms, not by being chosen."
  sub_pullusism: "Pullusism"
  sub_pullusism_desc: "Governance runs through confederation, not hierarchy. Each local community tends its own flame, a direct descendant of the god's original immortal fire, and answers to no clergy above it beyond that shared flame. Leadership within a community falls naturally to those marked by faith, silver white, unusually thick hair, treated as a visible sign of standing rather than an earned title. Once a decade, the marked leaders of every community elect one among themselves to represent and protect the confederation as a whole, a role that exists only for as long as the faith needs a single voice, not as a permanent seat above the others. The flame provides heat and healing that communities in the north cannot survive winter without, so devotion here is inseparable from need, and a leader's claim to standing is something anyone can see before they speak."
  sub_thalassaus: "Thalassausism"
  sub_thalassaus_desc: "Refer to the Thalassaus faith section above this chapter. Fyjuh itself is the deity, too vast and silent to confirm or deny anything directly, the same distance that leaves Ager Montis without a living voice to settle disputes. Governance here did not emerge from choice, it emerged from loss. Continental faiths destroyed the mainland cultures that once followed Thalassaus, scattering what remained onto small, defensible islands, and even the faith's own deeper knowledge of arcana was lost in that destruction, not merely forgotten. What survives is shaped by that history, small, insular island governments wary of any single power, secular or faithful, growing dominant enough to finish what was already done to them once. That fear gives Thalassausism a real kinship with Pluralism's own suspicion of domination, even while its authority still flows from Fyjuh rather than from popular consent. It is Theocratism's closest neighbor to Pluralist values without ever actually becoming one."
  sub_ager_montis: "Ager-Montisism"
  sub_ager_montis_desc: "Refer to the Ager-Montis faith section above this chapter. Rule typically falls to a high council of elders, fitting a faith bound to a planetary deity too vast and silent to confirm or deny anything directly. Its strong ties to elvish and dwarvish identity mean the council currently speaks with one voice mostly because there has been nothing yet to disagree over. That may not hold indefinitely."
  sub_animaekin: "Animaekinism"
  sub_animaekin_desc: "Refer to the Animaekin faith section above this chapter. Governance follows the tribe's bond to its spirit directly, since the same connection that grants a Beastfolk their spirit's favor is what tends to mark them as leader. Authority here is not appointed or inherited so much as demonstrated, whoever carries the strongest living bond is already, in practice, the one the tribe follows."
  sub_crownfather: "Crownfather"
  sub_crownfather_desc: "Refer to the Crownfather faith section above this chapter. Legitimacy here is not a matter of interpretation, it is a mechanism with a visible outcome. Each dead Emperor's soul becomes a gemstone bound to the Empyrean Crown, and the crown extends its power to whichever successor currently holds it. That power is conditional, not permanent. A successor who shames or harms the nation loses the crown's favor outright. The crown then passes to a new claimant, drawn from the royal line first, and only from the wider bloodline of the first Emperor if no royal heir remains. Where Harmonainism's clergy must interpret a will that can never be confirmed, Crownfather's rulers are tested constantly, and the crown's withdrawal of power is itself the proof of illegitimacy, no theology or faction dispute required."

  authoritarianism:0 "Authoritarianism"
  authoritarianism_noun:0 "Authoritarian Movement"
  authoritarianism_desc:0 "Totalitarian Regime"
  authoritarianism_acceptance:0 "£ai_acceptance_texticon  Acceptance of Authoritarianism Diplomacy"
  authoritarianism_drift:0 "£boost_popularity_texticon  Daily Authoritarianism Drift"
  sub_monarchy: "Monarchism"
  sub_monarchy_desc: "Legitimacy rests on bloodline, not demonstrated skill or popular consent. A ruler is fit to govern because they were born to govern, and the stability of clear, undisputed succession is treated as more valuable than any single ruler's individual competence."
  sub_authoritarian: "Authoritarianism"
  sub_authoritarian_desc: "Legitimacy rests on demonstrated strength and results, not birth or consent. A ruler earns authority by proving they can deliver order, security, or prosperity that a divided or consultative government could not, and holds it only as long as they keep delivering."
  sub_technocracy: "Technocracy"
  sub_technocracy_desc: "Legitimacy rests on specialized, technical, or scientific expertise, not birth, wealth, or command. Those most qualified to solve a given problem are held to be the ones who should hold authority over it, and government becomes a matter of correct administration rather than politics."
  sub_stratocracy: "Stratocracy"
  sub_stratocracy_desc: "Legitimacy rests on military command structure specifically. The chain of command that governs the army is treated as the correct model for governing the nation as a whole, since discipline, hierarchy, and swift decisive action under threat are the qualities the state itself needs most."
  sub_auth_harmonainism: "Totalitarian Harmonainism"
  sub_auth_harmonainism_desc: "A military government ruling under Harmonainist influence, without yet being a true theocracy. The military holds real power, the faith provides legitimacy and moral direction, and this arrangement functions as a transitional stage, states here are typically moving toward full Theocratic Harmonainism rather than settling into military rule permanently."
  sub_oligarchy: "Oligarchy"
  sub_oligarchy_desc: "Legitimacy rests on wealth, family networks, or established economic power rather than bloodline, military command, or a single ruler's demonstrated skill. A small class holds power collectively because they already hold the resources a state depends on, and that concentration is treated as natural and correct rather than as something to be corrected."

  unitism:0 "Unitism"
  unitism_noun:0 "Unity Movement"
  unitism_desc:0 "Unity Regime"
  unitism_acceptance:0 "£ai_acceptance_texticon  Acceptance of Unitism Diplomacy"
  unitism_drift:0 "£boost_popularity_texticon  Daily Unitism Drift"
  sub_ultra_nationalism: "Ultra-Nationalism"
  sub_ultra_nationalism_desc: "The nation's people are pure, and both intermixing with outsiders and interference from foreign states erode that purity, erasing culture, blood, and history over time. Arcana itself is treated the same way. What the land provides belongs to the blood tied to that land, and foreign hands drawing from it are no different than foreign blood diluting it, both are a theft of what rightfully sustains the nation's people alone. Only constant, authoritative protection of the nation, its land, its arcana, and its bloodline together, prevents that decay."
  sub_national_unitism: "National-Unitism"
  sub_national_unitism_desc: "The nation is pure, and capitalism corrupts that purity by pitting our own people against each other for profit instead of uniting them. Arcana itself, the very energy our people need to live, has been left in the hands of foreign owners and native capitalists who drain it for profit rather than draw it at a pace our people can sustain. Wealth, land, and arcana alike must be seized from them and redistributed among the true people of the nation, so that no one among the pure is left without the means to live by their own kind's greed. Foreigners must be blocked from owning, manipulating, or profiting from what rightfully belongs to the nation's people."
  sub_unitism: "Unitism"
  sub_unitism_desc: "Arcana renews itself, but only if it is drawn at a pace the world can replace. Those who own the capacitors, the attunements, and the arcana rich land have no reason to respect that pace. It is not their own survival at stake when the well runs low, only their profit margin when it runs high. Ordinary people are left to bear Arcana Fatigue and rising costs created by an extraction they never chose and never profited from. Where Syndicalism trusts the unions alone to govern without any state at all, Unitism takes a different path. The propertyless must first seize the state itself and use it to take that extraction out of private hands entirely, so that arcana is drawn at a rate the world can sustain. Only then can any collective, of faith, party, or union, be trusted to rule without a state standing above it to enforce that restraint."
  sub_syndicalism: "Syndicalism"
  sub_syndicalism_desc: "The trade unions that formed to protect workers are themselves the natural and legitimate basis for governing a nation, since people are already organized by the trades and industries they work within. This includes those who craft attunements and tend the capacitors that draw arcana itself. No state or party is needed above them. The unions federate directly with one another, and that federation is the government. Rule by those who produce, including those who draw the world's own life energy, is more legitimate than rule by those who merely administer or profit from it at a distance. Where Fascism binds unions beneath the state's authority, Syndicalism refuses any authority standing above the unions at all. A state that could command the unions, or command who draws arcana and how much, could just as easily be turned against them."
  sub_fascism: "Fascism"
  sub_fascism_desc: "The state is a single body, and corporations are organs within it, existing to serve that body rather than their own profit. Labor and capital are bound together under the state's direction rather than left to conflict, since a house divided against itself, worker against owner, cannot serve the nation as one. The people and the corporations that employ them are held as equals before the state, neither permitted to dominate the other, so that both remain organs of the same ethnic and national whole rather than rivals within it."
  sub_harmonization: "Harmonization"
  sub_harmonization_desc: "Private ownership of arcana is not just exploitation, it is sacrilege. Every capacitor hoarded and every well drawn past its pace does not merely deplete arcana, it creates the Necrotic, ground stripped bare and left to mutate or die. Collective stewardship of arcana is therefore a sacred duty, and class exploitation and Kehnohs's spread are the same sin seen from two angles. Humanity stands first among the faithful, since Enoshi walked among them and doctrine speaks first to human souls. Humanoid peoples stand second, welcomed into the collective but never fully equal within it. All others remain outside the faith's protection, whatever stewardship of arcana they themselves practice."
